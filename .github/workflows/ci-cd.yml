name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [created]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ruff check
        uses: astral-sh/ruff-action@v3
        with:
          args: "check"

      - name: Run ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          args: "format --check"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Simple ffmpeg installation that works in both GitHub Actions and local testing
      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            apt-get update || true
            apt-get install -y ffmpeg || echo "Failed to install ffmpeg with apt-get, may need to be pre-installed in the container"
          fi
          # Print ffmpeg version for verification
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version | head -n 1
          else
            echo "ffmpeg not found in PATH"
          fi

      # This step is needed for GitHub Actions but may fail in local testing
      # which is acceptable for local validation
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
        continue-on-error: ${{ env.ACT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Install dependencies using uv
      - name: Install dependencies
        run: |
          uv sync --extra dev

      # Run tests using uv
      - name: Run tests
        run: |
          uv run pytest tests/

      # Generate coverage with Python 3.12 only in GitHub Actions
      - name: Generate Coverage Report
        if: matrix.python-version == '3.12' && !env.ACT
        run: |
          uv run pytest --cov=pydub --cov-report=term --cov-report=html

  deploy:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        shell: bash
        run: |
          if command -v sudo >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          else
            apt-get update || true
            apt-get install -y ffmpeg || echo "Failed to install ffmpeg with apt-get, may need to be pre-installed in the container"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
        continue-on-error: ${{ env.ACT }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Build package
        run: uv build

      - name: Publish to PyPI
        if: github.event_name == 'release' && !env.ACT
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}